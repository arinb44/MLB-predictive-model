name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch's default Linux wheel pulls ~7GB of unused NVIDIA CUDA
          # packages on a CPU-only runner (same issue as the Dockerfile —
          # see src/models/gbm.py). Installing the CPU-only build first
          # means the torch==... pin in requirements.txt is already
          # satisfied, so pip skips reinstalling it.
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
        # tests/test_api.py skips gracefully when data/processed/*.csv and
        # models/production_model.joblib aren't present — this repo doesn't
        # commit those (they're multi-GB-scale pulls / trained artifacts,
        # see README's "Reproducing the pipeline"), so CI always exercises
        # the leakage-safe feature/Elo tests and skips the API layer here.
