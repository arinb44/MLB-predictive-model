ass="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/><path class="r-trail" d=""/></g><g><circle class="r-solid" cx="158.2" cy="117.8" r="7.1"/><circle class="r-solid" cx="146.9" cy="109.4" r="7.1"/><circle class="r-handle" cx="160.1" cy="119.2" r="3.5"/><path class="r-handle" d="M161.2 117.7L123.1 89.2L101.5 72.2L98.0 76.9L120.7 92.6L159.0 120.7Z"/><path class="r-barrel" d="M102.8 73.2L83.1 55.5L50.8 31.5L44.3 40.3L76.7 64.2L99.3 77.8Z"/><circle class="r-barrel" cx="47.6" cy="35.9" r="5.4"/></g></g></g>
